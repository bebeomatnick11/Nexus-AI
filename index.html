<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI — True Agent Workspace V2</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0B0F17',
                            800: '#111827',
                            700: '#1F2937',
                            600: '#374151'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons & Markdown Parsers -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body class="bg-dark-900 text-gray-100 h-screen w-screen overflow-hidden flex font-sans antialiased">

    <!-- BACKDROP OVERLAY FOR MOBILE SIDEBAR -->
    <div id="mobile-overlay" onclick="app.toggleSidebar(false)" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden transition-opacity"></div>

    <!-- APP SIDEBAR -->
    <aside id="app-sidebar" class="fixed md:relative inset-y-0 left-0 z-40 w-72 bg-dark-800 border-r border-dark-700 flex flex-col justify-between shrink-0 select-none -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <!-- Top Workspace Branding & Controls -->
        <div class="p-4 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">N</div>
                    <span class="font-bold text-lg tracking-wide">NexusAI</span>
                    <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded font-mono">v2.0</span>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="app.switchTab('chat')" title="Back to Chat" class="text-gray-400 hover:text-white transition p-1.5 rounded-lg hover:bg-dark-700">
                        <i class="fa-solid fa-comments"></i>
                    </button>
                    <button onclick="app.toggleSidebar(false)" class="md:hidden text-gray-400 hover:text-white p-1.5 rounded-lg hover:bg-dark-700">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- New Chat Button -->
            <button onclick="app.createNewChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-md shadow-indigo-600/20">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>

            <!-- Conversations History List -->
            <div class="flex flex-col gap-1 overflow-y-auto max-h-52 pr-1" id="conversation-list">
                <!-- Items populated dynamically via app.js -->
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="px-4 py-2 border-t border-dark-700 flex flex-col gap-1">
            <a href="#skills" onclick="app.switchTab('skills')" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-400 w-5"></i> Skills
            </a>
            <a href="#memory" onclick="app.switchTab('memory')" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm">
                <i class="fa-solid fa-brain text-emerald-400 w-5"></i> Memory Inspector
            </a>
            <a href="#tools" onclick="app.switchTab('tools')" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm">
                <i class="fa-solid fa-toolbox text-amber-400 w-5"></i> Tools Registry
            </a>
            <a href="#debug" onclick="app.switchTab('debug')" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm">
                <i class="fa-solid fa-terminal text-rose-400 w-5"></i> Debug Panel
            </a>
        </div>

        <!-- Footer Data & Utility Controls -->
        <div class="p-4 border-t border-dark-700 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button onclick="app.exportData()" title="Backup Conversations Data" class="text-xs bg-dark-700 hover:bg-dark-600 text-gray-300 px-2.5 py-1.5 rounded-lg border border-dark-600 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> Export
                </button>
                <label title="Import Conversations Backup" class="text-xs bg-dark-700 hover:bg-dark-600 text-gray-300 px-2.5 py-1.5 rounded-lg border border-dark-600 transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-upload"></i> Import
                    <input type="file" accept=".json" onchange="app.importData(event)" class="hidden">
                </label>
            </div>
            <span class="text-[10px] text-gray-500 font-mono">Local SPA</span>
        </div>
    </aside>

    <!-- MAIN CONTENT WORKSPACE AREA -->
    <main class="flex-1 flex flex-col h-full bg-dark-900 relative overflow-hidden w-full">
        
        <!-- Header Bar -->
        <header class="h-14 border-b border-dark-700 px-4 md:px-6 flex items-center justify-between bg-dark-800/50 backdrop-blur z-10">
            <div class="flex items-center gap-3">
                <button onclick="app.toggleSidebar(true)" class="md:hidden text-gray-300 hover:text-white p-1.5 rounded-lg hover:bg-dark-700 transition">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <span id="current-chat-title" class="font-semibold text-gray-200 truncate max-w-[150px] sm:max-w-xs">New Conversation</span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 hidden sm:inline-block">Real Agent Engine</span>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="app.clearCurrentChat()" class="text-gray-400 hover:text-rose-400 text-xs p-2 sm:px-3 sm:py-1.5 rounded-lg border border-dark-700 hover:border-rose-500/40 transition">
                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Clear Chat</span>
                </button>
            </div>
        </header>

        <!-- VIEW 1: MAIN CHAT CONTAINER -->
        <div id="main-chat-view" class="flex-1 flex flex-col h-[calc(100vh-3.5rem)] relative overflow-hidden">
            <!-- Messages List -->
            <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl mx-auto w-full">
                <!-- Dynamically populated messages -->
            </div>

            <!-- Loading Typying Indicator -->
            <div id="typing-indicator" class="hidden px-6 py-2 max-w-4xl mx-auto w-full flex items-center gap-2 text-xs text-indigo-400 font-mono">
                <i class="fa-solid fa-circle-notch animate-spin"></i> Agent Engine đang suy luận & thực thi tools...
            </div>

            <!-- Input Box Container -->
            <div class="p-4 bg-dark-900 border-t border-dark-700/60">
                <div class="max-w-4xl mx-auto relative flex items-end bg-dark-800 rounded-2xl border border-dark-700 focus-within:border-indigo-500/50 transition p-2">
                    <textarea id="chat-input" rows="1" placeholder="Nhập tin nhắn hoặc yêu cầu (VD: Tính 123 * 456, Tôi tên là...)..." class="w-full bg-transparent text-gray-200 placeholder-gray-500 text-sm focus:outline-none resize-none px-3 py-2 max-h-32 overflow-y-auto"></textarea>
                    <button id="send-btn" class="w-9 h-9 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center transition shrink-0 ml-2 shadow-lg shadow-indigo-600/20">
                        <i class="fa-solid fa-arrow-up text-sm"></i>
                    </button>
                </div>
                <div class="text-[11px] text-gray-500 text-center mt-2">
                    NexusAI Agent V2 hoạt động với Real Agent Loop, IndexedDB Memory và Safe Tool Executors.
                </div>
            </div>
        </div>

        <!-- VIEW 2: TAB CONTENT CONTAINER (Skills, Memory, Tools, Debug) -->
        <div id="tab-content-view" class="hidden flex-1 overflow-y-auto bg-dark-900">
            <!-- Dynamic Tab Content Rendered via app.js -->
        </div>
    </main>

    <!-- AGENT RUNTIME & APPLICATION SCRIPTS -->
    <script type="module" src="js/agent-runtime.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
